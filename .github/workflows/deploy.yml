name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight deploy, but never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build
        uses: withastro/action@v6
        with:
          node-version: 22
          # Pinned to match local dev. `pnpm@latest` resolves to pnpm 11, which
          # enforces a 24h minimumReleaseAge on lockfile entries by default —
          # a lockfile resolved locally on pnpm 10 fails CI whenever it contains
          # a package published that day. Pin both ends instead of letting the
          # two drift. See `packageManager` in package.json.
          package-manager: pnpm@10.13.1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
